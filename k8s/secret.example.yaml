# TEMPLATE — copy this file to secret.yaml, fill in your real values, and
# apply secret.yaml instead. secret.yaml is gitignored (see k8s/.gitignore)
# so real credentials never get committed; this .example file with
# placeholders is the only one that should ever be checked in.
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # edit k8s/secret.yaml with your real MONGODB_URI / JWT_SECRET
#   kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: study-room-secret
  namespace: distributed-study-room
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/?appName=Cluster0"
  JWT_SECRET: "replace-with-a-long-random-string"
