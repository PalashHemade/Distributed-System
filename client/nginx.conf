server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routes like /classroom/:code and
    # /admin/distributed must resolve to index.html on a direct load or
    # refresh (there's no actual server-side route for them), and React
    # Router takes over from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
